name: Build Android APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    tags: ['v*']            # pushing a tag like v1.0.0 also publishes a Release

permissions:
  contents: write           # needed to attach the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install core dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo modules at versions matching this Expo SDK
        run: |
          npx expo install expo-video expo-document-picker expo-screen-orientation expo-brightness expo-video-thumbnails expo-linear-gradient expo-font @react-native-async-storage/async-storage @expo-google-fonts/manrope
          npx expo install --fix

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Give Gradle more memory
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: Build release APK (arm64 only, faster and smaller)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VideoPlayer.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-apk
          path: VideoPlayer.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoPlayer.apk
